version: '3.9'

services:
  crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-app
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: production
      PORT: 5173
      HOST: 0.0.0.0
      # SQLite database in a named volume (persists across restarts)
      DATABASE_URL: file:/data/crm.db
    volumes:
      # Mount data directory so database persists
      - crm-data:/data
      # Mount logs for inspection
      - crm-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/api/health', (r) => { if (r.statusCode !== 200) throw new Error(r.statusCode); })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  crm-data:
    driver: local
  crm-logs:
    driver: local
